name: Build executables

# Builds the standalone TeamLooker executable for Windows, macOS and Linux.
# Push a tag like v0.2.0 to also publish them on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TeamLooker-windows.exe
            built: dist/TeamLooker.exe
          - os: macos-latest
            artifact: TeamLooker-macos
            built: dist/TeamLooker
          - os: ubuntu-latest
            artifact: TeamLooker-linux
            built: dist/TeamLooker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Regenerate icons
        run: python assets/make_icons.py
      - name: Build
        run: pyinstaller packaging/teamlooker.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "TeamLooker ${{ github.ref_name }}" \
            --notes "Ejecutables autocontenidos de TeamLooker. Descarga el archivo de tu sistema operativo y ejecútalo (no requiere instalación)." \
            artifacts/*
